services:

  # ── Auth microservice ───────────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    image: abhik98/cicd-auth-service:latest
    env_file:
      - ./services/auth-service/.env      # DB_* point at the Aurora cluster
    restart: unless-stopped
    networks:
      - todo-network

  # ── Todo microservice ───────────────────────────────────────────────────────
  todo-service:
    build: ./services/todo-service
    image: abhik98/cicd-todo-service:latest
    env_file:
      - ./services/todo-service/.env
    restart: unless-stopped
    networks:
      - todo-network

  # ── API Gateway ──────────────────────────────────────────────────────────────
  # Single backend entry point. Not host-exposed — only the client reaches it.
  gateway:
    build: ./services/gateway
    image: abhik98/cicd-gateway:latest
    restart: unless-stopped
    networks:
      - todo-network
    depends_on:
      - auth-service
      - todo-service

  # ── React + nginx (static SPA) ────────────────────────────────────────────────
  # The ONLY host-exposed container. Serves the SPA and forwards /api → gateway.
  client:
    build: ./client
    image: abhik98/cicd-client:latest
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - todo-network
    depends_on:
      - gateway

networks:
  todo-network:
    driver: bridge
