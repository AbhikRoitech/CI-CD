services:

  # ── Auth microservice ───────────────────────────────────────────────────────
  # Owns auth_db (users). Signs JWTs. Uses LOCAL host Postgres (no db container).
  # Not exposed to the host — only the gateway can reach it (internal network).
  auth-service:
    build: ./services/auth-service
    image: abhik98/cicd-auth-service:latest
    env_file:
      - ./services/auth-service/.env      # PORT, DB_* (Aurora endpoint), JWT_SECRET
    networks:
      - todo-network

  # ── Todo microservice ───────────────────────────────────────────────────────
  # Owns todo_db (todos). Verifies JWTs with the SAME JWT_SECRET as auth-service.
  todo-service:
    build: ./services/todo-service
    image: abhik98/cicd-todo-service:latest
    env_file:
      - ./services/todo-service/.env
    networks:
      - todo-network

  # ── API Gateway ──────────────────────────────────────────────────────────────
  # The single backend entry point. Routes /api/* to the right service.
  # Clients never talk to the services directly — only to the gateway.
  gateway:
    build: ./services/gateway
    image: abhik98/cicd-gateway:latest
    networks:
      - todo-network
    depends_on:
      - auth-service
      - todo-service

  # ── React + nginx (static SPA) ────────────────────────────────────────────────
  # Serves the built React app and forwards /api → gateway.
  client:
    build: ./client
    image: abhik98/cicd-client:latest
    ports:
      - "80:80"
    networks:
      - todo-network
    depends_on:
      - gateway

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  todo-network:
    driver: bridge
